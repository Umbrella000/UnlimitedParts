name: CI/CD

on:
  push:
    branches: [ main ]          # аналог Enable continuous integration + Branch filters
  pull_request:
    branches: [ main ]
  workflow_dispatch:            # ручной запуск кнопкой

jobs:
  build:
    runs-on: ubuntu-latest      # аналог Hosted agent pool
    timeout-minutes: 10         # аналог вкладки Options -> Timeout
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Vet (статический анализ)
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build -o dist/server .

      - name: Test
        run: go test -v ./...