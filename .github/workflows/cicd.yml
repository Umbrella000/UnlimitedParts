name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build -o dist/server .

      - name: Test
        run: go test -v ./...

      - name: Publish build artifacts      # аналог PublishBuildArtifacts, ArtifactName drop
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: app/dist/server

  deploy:
    needs: build                           # аналог "стадия Deploy идёт после Build"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                      # право публиковать пакеты

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts     # аналог DownloadBuildArtifacts
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: app

      - name: Login to ghcr.io             # аналог Authorize Azure subscription
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image         # аналог Azure App Service deploy
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/umbrella000/partsunlimited:latest